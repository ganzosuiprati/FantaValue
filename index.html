<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaValue 2000 - Asta Serie A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Teko', sans-serif;
      background: radial-gradient(circle at center, #1b2838 0%, #0d1117 100%);
      color: #e6f4ff;
      letter-spacing: 0.5px;
    }
    .pes-font { font-family: 'Press Start 2P', cursive; }
    .pes-card {
      background: linear-gradient(135deg, rgba(20, 32, 50, 0.9) 0%, rgba(10, 18, 30, 0.95) 100%);
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
    }
    .pes-header {
      background: linear-gradient(90deg, #ff0055 0%, #ff5500 100%);
      clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
    }
    .pes-btn {
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      transition: all 0.2s ease;
    }
    .pes-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.2);
    }
    .pes-table th {
      background: #162436;
      color: #00ffcc;
      border-bottom: 2px solid #00ffcc;
    }
    .pes-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
    .pes-table tr:hover { background: rgba(0, 255, 204, 0.15); }
    .player-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid #00ffcc;
    }
  </style>
</head>
<body class="min-h-screen p-2 md:p-6">

  <!-- BANNER CREDITI -->
  <div class="max-w-5xl mx-auto mb-3 bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 border border-cyan-400/40 p-2 text-center rounded flex items-center justify-between px-4">
    <span class="pes-font text-[10px] text-yellow-300">⚡ FANTA-VALUE ENGINE</span>
    <span class="text-sm font-bold tracking-wider text-slate-200">
      CREATED BY <span class="text-cyan-400 font-black">FRANCESCO COPPOLA</span> 
      <a href="https://instagram.com/ganzosuiprati" target="_blank" class="ml-2 text-pink-400 hover:text-pink-300 underline font-black">@ganzosuiprati</a>
    </span>
  </div>

  <header class="max-w-5xl mx-auto mb-6 flex justify-between items-center border-b-2 border-cyan-400 pb-3">
    <div class="pes-header px-6 py-1 text-white shadow-lg">
      <h1 class="pes-font text-lg md:text-xl tracking-tighter uppercase italic">FANTA-VALUE <span class="text-yellow-300">2000</span></h1>
    </div>
    <div class="text-right">
      <span class="pes-font text-[10px] text-cyan-400 block">SERIE A DATABASE</span>
      <span id="statusIndicator" class="text-xs font-bold text-yellow-400 animate-pulse">CARICAMENTO IN CORSO...</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto space-y-5">
    <section class="pes-card p-4 rounded-none">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 text-lg">
        <div>
          <label class="block text-cyan-400 font-bold uppercase text-sm">PARTECIPANTI</label>
          <input type="number" id="numPartecipanti" value="10" min="4" max="16" class="w-full bg-slate-900 border-2 border-cyan-500 text-yellow-300 font-black text-center text-xl p-1 focus:outline-none focus:border-pink-500">
        </div>
        <div>
          <label class="block text-cyan-400 font-bold uppercase text-sm">BUDGET TOTALE</label>
          <input type="number" id="budgetSingolo" value="500" min="100" max="1000" class="w-full bg-slate-900 border-2 border-cyan-500 text-yellow-300 font-black text-center text-xl p-1 focus:outline-none focus:border-pink-500">
        </div>
        <div class="col-span-2">
          <label class="block text-cyan-400 font-bold uppercase text-sm">RICERCA GIOCATORE / SQUADRA</label>
          <input type="text" id="searchInput" placeholder="ES: LAUTARO, INTER, NAPOLI..." class="w-full bg-slate-900 border-2 border-cyan-500 text-white font-bold uppercase p-1 px-3 text-lg focus:outline-none focus:border-pink-500 placeholder-slate-600">
        </div>
      </div>

      <div class="flex gap-2 justify-center my-3 text-xl font-bold">
        <button onclick="setRole('ALL')" id="btn-ALL" class="pes-btn bg-cyan-400 text-slate-950 px-6 py-1 font-black">TUTTI</button>
        <button onclick="setRole('P')" id="btn-P" class="pes-btn bg-slate-800 text-cyan-400 px-5 py-1 border border-cyan-500">POR</button>
        <button onclick="setRole('D')" id="btn-D" class="pes-btn bg-slate-800 text-cyan-400 px-5 py-1 border border-cyan-500">DIF</button>
        <button onclick="setRole('C')" id="btn-C" class="pes-btn bg-slate-800 text-cyan-400 px-5 py-1 border border-cyan-500">CEN</button>
        <button onclick="setRole('A')" id="btn-A" class="pes-btn bg-slate-800 text-cyan-400 px-5 py-1 border border-cyan-500">ATT</button>
      </div>
    </section>

    <section class="pes-card p-2 md:p-4 rounded-none">
      <div class="flex justify-between items-center mb-2 px-2 text-xl">
        <span class="text-pink-500 font-bold uppercase tracking-wider">LISTA CALCIATORI DISPONIBILI</span>
        <span id="playerCount" class="pes-font text-xs text-yellow-300">0 GIOCATORI</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left pes-table text-xl">
          <thead>
            <tr class="uppercase text-center">
              <th class="p-2 text-left">GIOCATORE</th>
              <th class="p-2">SQUADRA</th>
              <th class="p-2">RUOLO</th>
              <th class="p-2">FM</th>
              <th class="p-2">TIT%</th>
              <th class="p-2 text-yellow-300 font-black">PREZZO MAX</th>
              <th class="p-2">VALUTAZIONE</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-center divide-y divide-slate-800">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let rawPlayers = [];
    let activeRole = 'ALL';

    const API_URL = './players.json';

    function normalizzaRuolo(r) {
      if (!r) return 'A';
      const val = r.toString().trim().toUpperCase();
      if (val === '1' || val === 'POR' || val === 'P') return 'P';
      if (val === '2' || val === 'DIF' || val === 'D') return 'D';
      if (val === '3' || val === 'CEN' || val === 'C') return 'C';
      if (val === '4' || val === 'ATT' || val === 'A') return 'A';
      return val.charAt(0);
    }

    async function fetchPlayers() {
      const statusEl = document.getElementById('statusIndicator');
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("Errore HTTP: " + res.status);
        
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Formato JSON non valido");

        rawPlayers = data.map(p => {
          // Gestione dinamica chiave/valore
          const nomeVal = p.nome || p.squadra || 'Calciatore';
          const squadraVal = (p.squadra && p.squadra !== nomeVal && isNaN(p.squadra)) ? p.squadra : (p.club || p.team || 'Serie A');

          return {
            nome: String(nomeVal).trim(),
            squadra: String(squadraVal).trim(),
            ruolo: normalizzaRuolo(p.ruolo || p.role),
            fantamedia: parseFloat(String(p.fantamedia || p.fm || 6.0).replace(',', '.')) || 6.0,
            titolarita: parseInt(String(p.titolarita || p.starter || 80).replace('%', '')) || 80,
            pma: parseInt(p.pma || p.quotazione || p.price || 10) || 10,
            foto: p.foto || p.image || ''
          };
        });

        statusEl.innerText = "ONLINE - DATI IN TEMPO REALE";
        statusEl.className = "text-xs font-bold text-emerald-400";
      } catch (err) {
        console.error("Errore caricamento:", err);
        statusEl.innerText = "ERRORE CONNESSIONE DATI";
        statusEl.className = "text-xs font-bold text-pink-500";
      }
      renderTable();
    }

    function setRole(role) {
      activeRole = role;
      document.querySelectorAll('.pes-btn').forEach(btn => {
        if (btn.id.startsWith('btn-')) {
          btn.className = 'pes-btn bg-slate-800 text-cyan-400 px-5 py-1 border border-cyan-500';
        }
      });
      document.getElementById(`btn-${role}`).className = 'pes-btn bg-cyan-400 text-slate-950 px-6 py-1 font-black';
      renderTable();
    }

    function calculatePrices() {
      const partecipanti = parseInt(document.getElementById('numPartecipanti').value) || 10;
      const budgetSingolo = parseInt(document.getElementById('budgetSingolo').value) || 500;

      // Budget per reparto in percentuale sul budget del singolo fantallenatore
      const budgetReparto = {
        'A': budgetSingolo * 0.50, // 50% per l'attacco
        'C': budgetSingolo * 0.25, // 25% per il centrocampo
        'D': budgetSingolo * 0.15, // 15% per la difesa
        'P': budgetSingolo * 0.10  // 10% per i portieri
      };

      // Calcolo indice di valore (FM + Titolarità)
      const efsScores = rawPlayers.map(p => {
        const bonusFM = Math.max(0, p.fantamedia - 5.5); 
        const efs = Math.pow(bonusFM, 2.5) * (p.titolarita / 100);
        return { ...p, efs };
      });

      const maxEfsPerRuolo = { 'A': 0, 'C': 0, 'D': 0, 'P': 0 };
      efsScores.forEach(p => {
        if (p.efs > (maxEfsPerRuolo[p.ruolo] || 0)) maxEfsPerRuolo[p.ruolo] = p.efs;
      });

      return efsScores.map(p => {
        const maxRuolo = maxEfsPerRuolo[p.ruolo] || 1;
        const percentualeQuota = p.efs / maxRuolo; // da 0 a 1 rispetto al top del ruolo

        // Il Top Player di un reparto prende fino al ~60-70% del budget destinato a quel reparto
        let pMaxSingolo = Math.round((budgetReparto[p.ruolo] || 0) * percentualeQuota * 0.65);
        pMaxSingolo = Math.max(1, pMaxSingolo);

        let status = 'EQUO';
        const pmaScalato = Math.round((p.pma / 500) * budgetSingolo);
        if (pmaScalato > pMaxSingolo * 1.25) status = 'OVERPAY';
        else if (pmaScalato < pMaxSingolo * 0.75) status = 'AFFARE';

        return { ...p, pMaxSingolo, status };
      });
    }

    function renderTable() {
      const computed = calculatePrices();
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      let filtered = computed.filter(p => {
        const matchSearch = p.nome.toLowerCase().includes(search) || p.squadra.toLowerCase().includes(search);
        const matchRole = (activeRole === 'ALL' || p.ruolo === activeRole);
        return matchSearch && matchRole;
      });

      filtered.sort((a, b) => b.pMaxSingolo - a.pMaxSingolo);

      document.getElementById('playerCount').innerText = `${filtered.length} GIOCATORI`;

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      filtered.forEach(p => {
        let badge = '<span class="bg-slate-700 text-slate-300 px-2 py-0.5 text-xs font-bold">EQUO</span>';
        if (p.status === 'OVERPAY') {
          badge = '<span class="bg-red-600 text-white px-2 py-0.5 text-xs font-black tracking-widest border border-red-400">RISCHIO</span>';
        } else if (p.status === 'AFFARE') {
          badge = '<span class="bg-emerald-500 text-slate-950 px-2 py-0.5 text-xs font-black tracking-widest border border-emerald-300">🔥 AFFARE</span>';
        }

        // Generatore di Avatar Fallback se la foto Wikipedia non c'è
        const initial = p.nome.charAt(0).toUpperCase();
        const imgTag = p.foto 
          ? `<img src="${p.foto}" class="player-img" alt="${p.nome}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.nome)}&background=0d1117&color=00ffcc'">`
          : `<div class="player-img bg-slate-800 text-cyan-400 font-bold flex items-center justify-center border border-cyan-400">${initial}</div>`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2 text-left font-black text-white uppercase flex items-center gap-3">
            ${imgTag}
            <span>${p.nome}</span>
          </td>
          <td class="p-2 text-slate-400 text-base uppercase font-bold">${p.squadra}</td>
          <td class="p-2 font-bold text-cyan-400">${p.ruolo}</td>
          <td class="p-2 text-slate-200 font-bold">${p.fantamedia.toFixed(1)}</td>
          <td class="p-2 text-slate-300">${p.titolarita}%</td>
          <td class="p-2 text-yellow-300 font-black text-2xl">${p.pMaxSingolo} <span class="text-xs text-slate-400">CR</span></td>
          <td class="p-2">${badge}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    ['input', 'change'].forEach(evt => {
      document.getElementById('numPartecipanti').addEventListener(evt, renderTable);
      document.getElementById('budgetSingolo').addEventListener(evt, renderTable);
      document.getElementById('searchInput').addEventListener(evt, renderTable);
    });

    fetchPlayers();
  </script>
</body>
</html>
