<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantacalcio - Database Calciatori</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e676;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
    }

    .filter-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background-color: #2a2a2a;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: #00e676;
      color: #000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid #2c2c2c;
    }

    .card img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .role-badge {
      display: inline-block;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 50%;
      font-weight: bold;
      font-size: 14px;
      color: #fff;
    }

    .role-P { background-color: #f39c12; }
    .role-D { background-color: #27ae60; }
    .role-C { background-color: #2980b9; }
    .role-A { background-color: #c0392b; }

    .player-info {
      flex: 1;
    }

    .player-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .player-details {
      font-size: 13px;
      color: #aaa;
    }

    .stats {
      text-align: right;
    }

    .fantamedia {
      font-size: 18px;
      font-weight: bold;
      color: #00e676;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      margin-top: 50px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fantacalcio - Listone Serie A</h1>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cerca giocatore o squadra...">
      <button class="filter-btn active" onclick="filterRole('ALL')">TUTTI</button>
      <button class="filter-btn" onclick="filterRole('P')">POR</button>
      <button class="filter-btn" onclick="filterRole('D')">DIF</button>
      <button class="filter-btn" onclick="filterRole('C')">CEN</button>
      <button class="filter-btn" onclick="filterRole('A')">ATT</button>
    </div>

    <div id="loading" class="loading">Caricamento dati in corso...</div>
    <div id="playersGrid" class="grid"></div>
  </div>

  <script>
    let players = [];
    let currentRole = 'ALL';

    async function loadPlayers() {
      try {
        const response = await fetch('players.json');
        if (!response.ok) throw new Error("File players.json non trovato");
        players = await response.json();
        document.getElementById('loading').style.display = 'none';
        renderPlayers();
      } catch (err) {
        document.getElementById('loading').innerHTML = `❌ Errore nel caricamento dati.<br><small>Assicurati di aver eseguito 'python scraper.py' e di usare un server locale (es. Live Server).</small>`;
      }
    }

    function renderPlayers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('playersGrid');
      container.innerHTML = '';

      const filtered = players.filter(p => {
        const matchesRole = currentRole === 'ALL' || p.ruolo === currentRole;
        const matchesSearch = p.nome.toLowerCase().includes(search) || p.squadra.toLowerCase().includes(search);
        return matchesRole && matchesSearch;
      });

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <span class="role-badge role-${p.ruolo}">${p.ruolo}</span>
          ${p.stemma ? `<img src="${p.stemma}" alt="${p.squadra}">` : ''}
          <div class="player-info">
            <div class="player-name">${p.nome}</div>
            <div class="player-details">${p.squadra} • Tit. ${p.titolarita}%</div>
          </div>
          <div class="stats">
            <div class="fantamedia">${p.fantamedia}</div>
            <div style="font-size: 11px; color: #777;">FM</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterRole(role) {
      currentRole = role;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderPlayers();
    }

    document.getElementById('searchInput').addEventListener('input', renderPlayers);

    loadPlayers();
  </script>

</body>
</html>
