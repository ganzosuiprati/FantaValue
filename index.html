<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Pipita FantaValue</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030712;
      --panel-bg: #070f1e;
      --cyan: #00f0ff;
      --magenta: #ff0055;
      --yellow: #f1c40f;
      --text: #ffffff;
      --text-muted: #8a99ad;
      --border: #00f0ff44;
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.5);
      --glow-magenta: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--cyan); padding-bottom: 10px; box-shadow: var(--glow-cyan); }
    header h1 { font-family: 'Orbitron', sans-serif; color: var(--cyan); letter-spacing: 2px; text-transform: uppercase; font-size: 24px; text-shadow: var(--glow-cyan); display: flex; align-items: center; gap: 10px; }
    .dev-info { text-align: right; font-size: 12px; color: var(--text-muted); font-family: 'Orbitron', sans-serif; }
    .dev-info a { color: var(--magenta); text-decoration: none; }

    .main-container { display: grid; grid-template-columns: 2.2fr 1fr; gap: 20px; }

    .card { background: var(--panel-bg); border: 1px solid var(--cyan); border-radius: 6px; padding: 15px; box-shadow: inset 0 0 15px rgba(0,240,255,0.05); }

    /* Controls */
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; font-family: 'Orbitron', sans-serif; }
    .input-group input, .search-box input { width: 100%; padding: 8px; background: #02050d; border: 1px solid var(--cyan); color: #fff; border-radius: 4px; font-weight: bold; }

    .filters { display: flex; gap: 8px; margin-bottom: 15px; }
    .filter-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; font-family: 'Orbitron', sans-serif; }
    .filter-btn.active { background: var(--cyan); color: #000; box-shadow: var(--glow-cyan); }

    /* Table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; color: var(--text-muted); font-size: 11px; text-transform: uppercase; padding: 10px 8px; border-bottom: 1px solid var(--border); font-family: 'Orbitron', sans-serif; }
    td { padding: 10px 8px; border-bottom: 1px solid #112233; font-size: 15px; font-weight: 600; }

    .role-P { color: #f39c12; }
    .role-D { color: #2ecc71; }
    .role-C { color: #3498db; }
    .role-A { color: var(--magenta); }

    .btn-analisi { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 10px; margin-right: 5px; }
    .btn-prendi { background: var(--magenta); color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: bold; box-shadow: var(--glow-magenta); }
    .btn-remove { background: #e74c3c; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 8px; font-family: 'Orbitron', sans-serif; }

    /* Squad Sidebar */
    .squad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .squad-stat { margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; font-weight: bold; }
    .squad-stat-val { font-family: 'Orbitron', sans-serif; color: var(--cyan); }
    .squad-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #112233; font-size: 14px; }

    /* Modals & Tooltips */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: var(--panel-bg); border: 2px solid var(--cyan); border-radius: 8px; padding: 25px; width: 350px; text-align: center; box-shadow: var(--glow-cyan); position: relative; }
    .modal-box h2 { font-family: 'Orbitron', sans-serif; color: var(--cyan); margin-bottom: 15px; text-transform: uppercase; }
    .modal-input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--cyan); color: var(--yellow); font-size: 18px; font-family: 'Orbitron', sans-serif; text-align: center; margin: 15px 0; }
    .price-badge { padding: 8px; border-radius: 4px; font-family: 'Orbitron', sans-serif; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; display: block; border: 1px solid; }
    .badge-affarone { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border-color: #2ecc71; }
    .badge-equo { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border-color: #f1c40f; }
    .badge-pacco { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border-color: #e74c3c; }

    .tooltip { position: absolute; background: #020813; border: 1px solid var(--cyan); padding: 10px; border-radius: 4px; font-size: 11px; z-index: 500; display: none; box-shadow: var(--glow-cyan); text-align: left; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ EL PIPITA FANTAVALUE ⚡</h1>
    <div class="dev-info">
      Dev: Francesco Coppola<br>
      Instagram: <a href="https://instagram.com/ganzosuiprati" target="_blank">@ganzosuiprati</a>
    </div>
  </header>

  <div class="main-container">
    <div class="card">
      <div class="controls-grid">
        <div class="input-group">
          <label>Partecipanti</label>
          <input type="number" id="numPlayers" value="10" onchange="renderPlayers()">
        </div>
        <div class="input-group">
          <label>Budget Totale</label>
          <input type="number" id="totalBudget" value="1000" onchange="renderPlayers()">
        </div>
        <div class="search-box">
          <label>Ricerca Giocatore / Squadra</label>
          <input type="text" id="searchInput" placeholder="Es. Lautaro, Inter, Dimarco..." oninput="renderPlayers()">
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="setRoleFilter('TUTTI', this)">TUTTI</button>
        <button class="filter-btn" onclick="setRoleFilter('P', this)">POR</button>
        <button class="filter-btn" onclick="setRoleFilter('D', this)">DIF</button>
        <button class="filter-btn" onclick="setRoleFilter('C', this)">CEN</button>
        <button class="filter-btn" onclick="setRoleFilter('A', this)">ATT</button>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <h3 style="color: var(--magenta); font-family:'Orbitron'; font-size: 16px;">LISTA CALCIATORI REALI</h3>
        <span id="playerCount" style="color: var(--cyan); font-family:'Orbitron'; font-weight:bold;">0 GIOCATORI</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Giocatore</th>
            <th>Squadra</th>
            <th>Ruolo</th>
            <th>FM</th>
            <th>TIT%</th>
            <th>Prezzo Max</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody id="playerTableBody"></tbody>
      </table>
    </div>

    <!-- Squad Sidebar -->
    <div class="card">
      <div class="squad-header">
        <h3 style="font-family:'Orbitron'; color:#fff;">LA MIA ROSA</h3>
        <span id="squadCount" style="color: var(--cyan); font-family:'Orbitron'; font-weight: bold; font-size:18px;">0/25</span>
      </div>
      <div class="squad-stat">
        <span>CREDITI RIMANENTI:</span>
        <span class="squad-stat-val" id="remainingCredits">1000 CR</span>
      </div>
      <div class="squad-stat">
        <span>SPESI TOTALE:</span>
        <span class="squad-stat-val" id="spentCredits" style="color: var(--magenta);">0 CR</span>
      </div>
      <hr style="border-color: var(--border); margin: 15px 0;">
      <div id="squadList"></div>
    </div>
  </div>

  <!-- Buy Modal -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal-box">
      <h2 id="modalPlayerName">NOME GIOCATORE</h2>
      <div style="font-size:13px; color:var(--text-muted);">Prezzo Consigliato: <span id="modalTargetPrice" style="color:var(--cyan); font-weight:bold;">0 CR</span></div>
      <input type="number" id="paidPriceInput" class="modal-input" placeholder="Prezzo pagato..." oninput="updatePriceEvaluation()">
      <div id="priceEvaluationBadge" class="price-badge badge-equo">⚖️ INSERISCI PREZZO</div>
      <button class="btn-prendi" style="width:100%; padding:10px; font-size:14px;" onclick="confirmPurchase()">AGGIUNGI ALLA ROSA</button>
      <button class="btn-analisi" style="width:100%; margin-top:8px; border:none; color:var(--text-muted);" onclick="closeModal()">ANNULLA</button>
    </div>
  </div>

  <!-- Tooltip Analisi -->
  <div class="tooltip" id="analysisTooltip"></div>

  <script>
    let allPlayers = [];
    let currentRoleFilter = 'TUTTI';
    let mySquad = [];
    let selectedPlayer = null;

    async function init() {
      try {
        const response = await fetch('players.json?nocache=' + new Date().getTime());
        if (response.ok) {
          allPlayers = await response.json();
        }
      } catch (e) {
        console.error("Errore nel caricamento del JSON", e);
      }
      renderPlayers();
    }

    function setRoleFilter(role, btn) {
      currentRoleFilter = role;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPlayers();
    }

    function renderPlayers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('playerTableBody');
      tbody.innerHTML = '';

      const filtered = allPlayers.filter(p => {
        const matchesRole = currentRoleFilter === 'TUTTI' || p.ruolo === currentRoleFilter;
        const matchesSearch = p.nome.toLowerCase().includes(search) || p.squadra.toLowerCase().includes(search);
        return matchesRole && matchesSearch;
      });

      document.getElementById('playerCount').innerText = `${filtered.length} GIOCATORI`;

      filtered.forEach(p => {
        const inSquad = mySquad.some(item => item.id === p.id);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.nome}</strong></td>
          <td><span style="color:var(--cyan); font-weight:bold;">${p.squadra}</span></td>
          <td><span class="role-${p.ruolo}">${p.ruolo}</span></td>
          <td>${p.fantamedia}</td>
          <td>${p.titolarita}%</td>
          <td style="color: var(--yellow); font-family:'Orbitron'; font-weight: bold;">${p.pma} CR</td>
          <td>
            <button class="btn-analisi" onmouseenter="showAnalysis(event, ${p.pma})" onmouseleave="hideAnalysis()">ANALISI</button>
            ${inSquad 
              ? `<span style="color:var(--text-muted); font-size:11px; font-family:'Orbitron';">IN ROSA</span>` 
              : `<button class="btn-prendi" onclick="openBuyModal(${p.id})">+ PRENDI</button>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* Modal e Valutazione Prezzo */
    function openBuyModal(id) {
      selectedPlayer = allPlayers.find(p => p.id === id);
      document.getElementById('modalPlayerName').innerText = selectedPlayer.nome;
      document.getElementById('modalTargetPrice').innerText = `${selectedPlayer.pma} CR`;
      document.getElementById('paidPriceInput').value = selectedPlayer.pma;
      updatePriceEvaluation();
      document.getElementById('buyModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('buyModal').style.display = 'none';
    }

    function updatePriceEvaluation() {
      const paid = parseInt(document.getElementById('paidPriceInput').value) || 0;
      const target = selectedPlayer.pma;
      const badge = document.getElementById('priceEvaluationBadge');

      if (paid <= target * 0.85) {
        badge.className = "price-badge badge-affarone";
        badge.innerText = "🔥 AFFARONE";
      } else if (paid <= target * 1.15) {
        badge.className = "price-badge badge-equo";
        badge.innerText = "⚖️ PREZZO EQUO";
      } else {
        badge.className = "price-badge badge-pacco";
        badge.innerText = "⚠️ PACCO";
      }
    }

    function confirmPurchase() {
      const paidPrice = parseInt(document.getElementById('paidPriceInput').value) || selectedPlayer.pma;
      if (mySquad.length >= 25) {
        alert("Rosa piena!");
        return;
      }
      mySquad.push({ ...selectedPlayer, paidPrice });
      closeModal();
      updateSquadUI();
      renderPlayers();
    }

    /* Rimuovere Giocatore dalla Rosa */
    function removeFromSquad(id) {
      mySquad = mySquad.filter(p => p.id !== id);
      updateSquadUI();
      renderPlayers();
    }

    function updateSquadUI() {
      const squadList = document.getElementById('squadList');
      squadList.innerHTML = '';

      let totalSpent = 0;
      const totalBudget = parseInt(document.getElementById('totalBudget').value) || 1000;

      mySquad.forEach(p => {
        totalSpent += p.paidPrice;
        const item = document.createElement('div');
        item.className = 'squad-item';
        item.innerHTML = `
          <div>
            <strong>${p.nome}</strong> <span class="role-${p.ruolo}">[${p.ruolo}]</span>
          </div>
          <div style="display:flex; align-items:center;">
            <span style="color:var(--yellow); font-family:'Orbitron'; font-weight:bold; margin-right:5px;">${p.paidPrice} CR</span>
            <button class="btn-remove" onclick="removeFromSquad(${p.id})" title="Rimuovi">✕</button>
          </div>
        `;
        squadList.appendChild(item);
      });

      document.getElementById('squadCount').innerText = `${mySquad.length}/25`;
      document.getElementById('spentCredits').innerText = `${totalSpent} CR`;
      document.getElementById('remainingCredits').innerText = `${totalBudget - totalSpent} CR`;
    }

    /* Tooltip Analisi */
    function showAnalysis(e, pma) {
      const tt = document.getElementById('analysisTooltip');
      tt.innerHTML = `
        <strong>TARGET PREZZO:</strong><br>
        🔥 Affarone: ≤ ${Math.floor(pma * 0.85)} CR<br>
        ⚖️ Equo: ${Math.floor(pma * 0.86)} - ${Math.floor(pma * 1.15)} CR<br>
        ⚠️ Pacco: ≥ ${Math.floor(pma * 1.16)} CR
      `;
      tt.style.left = (e.pageX - 150) + 'px';
      tt.style.top = (e.pageY + 15) + 'px';
      tt.style.display = 'block';
    }

    function hideAnalysis() {
      document.getElementById('analysisTooltip').style.display = 'none';
    }

    window.onload = init;
  </script>
</body>
</html>
