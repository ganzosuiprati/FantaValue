<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Pipita FantaValue</title>
  <style>
    :root {
      --bg-color: #070d19;
      --panel-bg: #0d1b2a;
      --cyan: #00f0ff;
      --magenta: #ff0055;
      --text: #ffffff;
      --text-muted: #8a99ad;
      --border: #1b2d42;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--cyan); padding-bottom: 10px; }
    header h1 { color: var(--cyan); text-transform: uppercase; font-size: 22px; }

    .main-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input, .search-box input { width: 100%; padding: 8px; background: var(--bg-color); border: 1px solid var(--cyan); color: #fff; border-radius: 4px; }

    .filters { display: flex; gap: 5px; margin-bottom: 15px; }
    .filter-btn { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .filter-btn.active { background: var(--cyan); color: var(--bg-color); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; color: var(--text-muted); font-size: 11px; padding: 8px; border-bottom: 1px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }

    .role-badge { padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px; color: #fff; }
    .role-P { background: #e67e22; }
    .role-D { background: #27ae60; }
    .role-C { background: #2980b9; }
    .role-A { background: var(--magenta); }

    .btn-action { background: var(--magenta); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
    .btn-remove { background: #e74c3c; color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: 8px; }
    .btn-remove:hover { background: #c0392b; }

    .squad-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ El Pipita FantaValue ⚡</h1>
  </header>

  <div class="main-container">
    <div class="card">
      <div class="controls-grid">
        <div class="input-group">
          <label>Partecipanti</label>
          <input type="number" id="numPlayers" value="10" onchange="renderPlayers()">
        </div>
        <div class="input-group">
          <label>Budget</label>
          <input type="number" id="totalBudget" value="1000" onchange="renderPlayers()">
        </div>
        <div class="search-box">
          <label>Cerca Giocatore</label>
          <input type="text" id="searchInput" placeholder="Lautaro, Inter, Barella..." oninput="renderPlayers()">
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="setRoleFilter('TUTTI', this)">TUTTI</button>
        <button class="filter-btn" onclick="setRoleFilter('P', this)">POR</button>
        <button class="filter-btn" onclick="setRoleFilter('D', this)">DIF</button>
        <button class="filter-btn" onclick="setRoleFilter('C', this)">CEN</button>
        <button class="filter-btn" onclick="setRoleFilter('A', this)">ATT</button>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color: var(--magenta);">LISTONE GIOCATORI</h3>
        <span id="playerCount" style="color: var(--cyan); font-weight:bold;">0 GIOCATORI</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Giocatore</th>
            <th>Squadra</th>
            <th>Ruolo</th>
            <th>FM</th>
            <th>TIT%</th>
            <th>Quotazione</th>
            <th>Azione</th>
          </tr>
        </thead>
        <tbody id="playerTableBody"></tbody>
      </table>
    </div>

    <!-- Squadra dell'Utente -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <h3>LA MIA ROSA</h3>
        <span id="squadCount" style="color: var(--cyan); font-weight: bold;">0/25</span>
      </div>
      <div style="font-size:13px; margin-bottom:5px;">Crediti Rimanenti: <strong id="remainingCredits" style="color:var(--cyan);">1000 CR</strong></div>
      <div style="font-size:13px; margin-bottom:15px;">Spesi: <strong id="spentCredits" style="color:var(--magenta);">0 CR</strong></div>
      <hr style="border-color: var(--border); margin-bottom: 10px;">
      <div id="squadList"></div>
    </div>
  </div>

  <script>
    let allPlayers = [];
    let currentRoleFilter = 'TUTTI';
    let mySquad = [];

    async function init() {
      try {
        // Forziamo il recupero senza cache aggiungendo un parametro timestamp
        const response = await fetch('players.json?v=' + new Date().getTime());
        if (response.ok) {
          allPlayers = await response.json();
        }
      } catch (e) {
        console.error("Errore nel caricamento del JSON:", e);
      }
      renderPlayers();
    }

    function setRoleFilter(role, btn) {
      currentRoleFilter = role;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPlayers();
    }

    function renderPlayers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('playerTableBody');
      tbody.innerHTML = '';

      const filtered = allPlayers.filter(p => {
        const matchesRole = currentRoleFilter === 'TUTTI' || p.ruolo === currentRoleFilter;
        const matchesSearch = p.nome.toLowerCase().includes(search) || p.squadra.toLowerCase().includes(search);
        return matchesRole && matchesSearch;
      });

      document.getElementById('playerCount').innerText = `${filtered.length} GIOCATORI`;

      filtered.forEach(p => {
        const inSquad = mySquad.some(item => item.id === p.id);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${p.nome}</strong></td>
          <td><span style="color:var(--cyan); font-weight:bold;">${p.squadra}</span></td>
          <td><span class="role-badge role-${p.ruolo}">${p.ruolo}</span></td>
          <td>${p.fantamedia}</td>
          <td>${p.titolarita}%</td>
          <td style="color: #f1c40f; font-weight: bold;">${p.pma} CR</td>
          <td>
            ${inSquad 
              ? `<span style="color:var(--text-muted); font-size:11px;">In Rosa</span>` 
              : `<button class="btn-action" onclick="addToSquad(${p.id})">+ ACQUISTA</button>`
            }
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addToSquad(id) {
      if (mySquad.length >= 25) {
        alert("Rosa piena! Massimo 25 giocatori.");
        return;
      }
      const player = allPlayers.find(p => p.id === id);
      if (player && !mySquad.some(p => p.id === id)) {
        mySquad.push(player);
        updateSquadUI();
        renderPlayers();
      }
    }

    // FUNZIONE PER ELIMINARE IL GIOCATORE DALLA ROSA
    function removeFromSquad(id) {
      mySquad = mySquad.filter(p => p.id !== id);
      updateSquadUI();
      renderPlayers();
    }

    function updateSquadUI() {
      const squadList = document.getElementById('squadList');
      squadList.innerHTML = '';

      let totalSpent = 0;
      const totalBudget = parseInt(document.getElementById('totalBudget').value) || 1000;

      mySquad.forEach(p => {
        totalSpent += p.pma;
        const item = document.createElement('div');
        item.className = 'squad-item';
        item.innerHTML = `
          <div>
            <strong>${p.nome}</strong> <span class="role-badge role-${p.ruolo}">${p.ruolo}</span>
          </div>
          <div style="display:flex; align-items:center;">
            <span style="color:#f1c40f; font-weight:bold;">${p.pma} CR</span>
            <button class="btn-remove" onclick="removeFromSquad(${p.id})" title="Elimina dalla rosa">✕</button>
          </div>
        `;
        squadList.appendChild(item);
      });

      document.getElementById('squadCount').innerText = `${mySquad.length}/25`;
      document.getElementById('spentCredits').innerText = `${totalSpent} CR`;
      document.getElementById('remainingCredits').innerText = `${totalBudget - totalSpent} CR`;
    }

    window.onload = init;
  </script>
</body>
</html>
