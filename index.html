<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asta Fantacalcio Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #05070f;
      color: #ffffff;
      padding: 20px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .card {
      background: #0a0e17;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .filter-btn {
      background: #05070f;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #00f0ff;
      color: #000;
    }
    input, select {
      background: #05070f;
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      width: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 10px;
      text-align: left;
    }
    th {
      color: #00f0ff;
      border-bottom: 2px solid #00f0ff;
    }
    .btn-take {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- COLONNA SINISTRA: RICERCA E LISTONE -->
    <div>
      <div class="card">
        <div style="display: flex; gap: 15px;">
          <div style="flex: 1;">
            <label style="color: #00f0ff; font-size: 12px; font-weight: bold;">PARTECIPANTI</label>
            <input type="number" id="num-participants" value="10">
          </div>
          <div style="flex: 1;">
            <label style="color: #00f0ff; font-size: 12px; font-weight: bold;">BUDGET TOTALE</label>
            <input type="number" id="total-budget-input" value="1000" onchange="updateBudget(this.value)">
          </div>
          <div style="flex: 2;">
            <label style="color: #00f0ff; font-size: 12px; font-weight: bold;">RICERCA GIOCATORE / SQUADRA</label>
            <input type="text" id="search-input" placeholder="Es. Lautaro, Inter, Dimarco..." onkeyup="renderPlayersTable()">
          </div>
        </div>

        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('ALL')">TUTTI</button>
          <button class="filter-btn" onclick="setFilter('P')">POR</button>
          <button class="filter-btn" onclick="setFilter('D')">DIF</button>
          <button class="filter-btn" onclick="setFilter('C')">CEN</button>
          <button class="filter-btn" onclick="setFilter('A')">ATT</button>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="color: #ff0055;">LISTA CALCIATORI REALI</h2>
          <span id="players-count" style="color: #ffcc00; font-weight: bold;">0 GIOCATORI</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>GIOCATORE</th>
              <th>SQUADRA</th>
              <th>RUOLO</th>
              <th>FM</th>
              <th>TIT%</th>
              <th>PREZZO MAX</th>
              <th>AZIONI</th>
            </tr>
          </thead>
          <tbody id="players-table-body">
            <!-- Render dinamico JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- COLONNA DESTRA: LA MIA ROSA -->
    <div>
      <div class="card" style="border-color: #00f0ff;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="color: #00f0ff;">LA MIA ROSA</h2>
          <h2 id="rosa-count" style="color: #ffcc00;">0/25</h2>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
          <span>CREDITI RIMANENTI:</span>
          <strong id="crediti-rimanenti" style="color: #ffcc00; font-size: 18px;">1000 CR</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
          <span>SPESI TOTALE:</span>
          <strong id="spesi-totale" style="color: #ff0055; font-size: 18px;">0 CR</strong>
        </div>

        <hr style="border-color: rgba(0,240,255,0.2); margin-bottom: 15px;">

        <div id="rosa-list">
          <p style="color:#666; font-style:italic;">Nessun giocatore acquistato.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT LOGICA DSHBOARD -->
  <script>
    let playersList = [];
    let myTeam = [];
    let totalBudget = 1000;
    let remainingBudget = 1000;
    let currentFilter = 'ALL';

    const TEAM_LOGOS = {
      "ATA": "https://a.espncdn.com/i/teamlogos/soccer/500/105.png",
      "BOL": "https://a.espncdn.com/i/teamlogos/soccer/500/107.png",
      "CAG": "https://a.espncdn.com/i/teamlogos/soccer/500/108.png",
      "COM": "https://a.espncdn.com/i/teamlogos/soccer/500/2932.png",
      "EMP": "https://a.espncdn.com/i/teamlogos/soccer/500/2622.png",
      "FIO": "https://a.espncdn.com/i/teamlogos/soccer/500/109.png",
      "GEN": "https://a.espncdn.com/i/teamlogos/soccer/500/3263.png",
      "INT": "https://a.espncdn.com/i/teamlogos/soccer/500/110.png",
      "JUV": "https://a.espncdn.com/i/teamlogos/soccer/500/111.png",
      "LAZ": "https://a.espncdn.com/i/teamlogos/soccer/500/112.png",
      "LEC": "https://a.espncdn.com/i/teamlogos/soccer/500/3440.png",
      "MIL": "https://a.espncdn.com/i/teamlogos/soccer/500/113.png",
      "MON": "https://a.espncdn.com/i/teamlogos/soccer/500/3282.png",
      "NAP": "https://a.espncdn.com/i/teamlogos/soccer/500/114.png",
      "PAR": "https://a.espncdn.com/i/teamlogos/soccer/500/115.png",
      "ROM": "https://a.espncdn.com/i/teamlogos/soccer/500/117.png",
      "TOR": "https://a.espncdn.com/i/teamlogos/soccer/500/239.png",
      "UDI": "https://a.espncdn.com/i/teamlogos/soccer/500/118.png",
      "VER": "https://a.espncdn.com/i/teamlogos/soccer/500/2180.png",
      "VEN": "https://a.espncdn.com/i/teamlogos/soccer/500/3283.png"
    };

    document.addEventListener('DOMContentLoaded', () => {
      fetchPlayers();
    });

    async function fetchPlayers() {
      try {
        const response = await fetch('./players.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Errore caricamento file JSON');
        const data = await response.json();
        
        playersList = data.map((p, index) => ({
          id: p.id || index + 1,
          ...p
        }));

        renderPlayersTable();
      } catch (error) {
        console.error('❌ Errore caricamento:', error);
      }
    }

    function calcolaPrezzoMax(pma, fantamedia) {
      const basePma = Number(pma) || 1;
      const fm = Number(fantamedia) || 6.0;
      let moltiplicatore = (totalBudget / 500);
      let stima = Math.round(basePma * 2.2 * moltiplicatore);

      if (fm >= 8.0) stima += Math.round(15 * moltiplicatore);
      else if (fm >= 7.5) stima += Math.round(8 * moltiplicatore);

      return Math.max(1, stima);
    }

    function renderPlayersTable() {
      const container = document.getElementById('players-table-body');
      const countDisplay = document.getElementById('players-count');
      const searchInput = document.getElementById('search-input')?.value.toLowerCase() || '';

      if (!container) return;

      let filtered = playersList.filter(p => {
        const matchRole = currentFilter === 'ALL' || p.ruolo === currentFilter;
        const matchSearch = p.nome.toLowerCase().includes(searchInput) || p.squadra.toLowerCase().includes(searchInput);
        const notTaken = !myTeam.some(taken => taken.id === p.id);
        return matchRole && matchSearch && notTaken;
      });

      filtered.sort((a, b) => calcolaPrezzoMax(b.pma, b.fantamedia) - calcolaPrezzoMax(a.pma, a.fantamedia));

      if (countDisplay) {
        countDisplay.textContent = filtered.length + ' GIOCATORI';
      }

      let htmlRows = '';
      for (let i = 0; i < filtered.length; i++) {
        const player = filtered[i];
        const prezzoMax = calcolaPrezzoMax(player.pma, player.fantamedia);
        const imgUrl = player.foto || TEAM_LOGOS[player.squadra] || '';
        const initial = player.nome.charAt(0).toUpperCase();

        const avatarHTML = imgUrl 
          ? '<img src="' + imgUrl + '" alt="' + player.nome + '" style="width:28px; height:28px; border-radius:50%; object-fit:cover; margin-right:8px;">'
          : '<div style="width:28px; height:28px; border-radius:50%; background:#0a0e17; border:1px solid #00f0ff; color:#00f0ff; display:inline-flex; align-items:center; justify-content:center; font-weight:bold; margin-right:8px;">' + initial + '</div>';

        htmlRows += '<tr style="border-bottom: 1px solid rgba(0, 240, 255, 0.1);">' +
          '<td style="display:flex; align-items:center; padding: 10px;">' + avatarHTML + '<span style="font-weight:bold; color:#fff;">' + player.nome.toUpperCase() + '</span></td>' +
          '<td style="color:#00f0ff; font-weight:bold;">' + player.squadra + '</td>' +
          '<td style="color:#ff0055; font-weight:bold;">' + player.ruolo + '</td>' +
          '<td>' + Number(player.fantamedia).toFixed(1) + '</td>' +
          '<td>' + player.titolarita + '%</td>' +
          '<td style="color:#ffcc00; font-weight:bold; font-size:16px;">' + prezzoMax + ' <small>CR</small></td>' +
          '<td><button class="btn-take" onclick="valutaEDAcquista(' + player.id + ')">+ PRENDI</button></td>' +
        '</tr>';
      }

      container.innerHTML = htmlRows;
    }

    function valutaEDAcquista(playerId) {
      const player = playersList.find(p => p.id === playerId);
      if (!player) return;

      const prezzoConsigliato = calcolaPrezzoMax(player.pma, player.fantamedia);

      const prezzoPagatoInput = prompt('A quanto hai acquistato ' + player.nome.toUpperCase() + '?\n(Prezzo Consigliato: ' + prezzoConsigliato + ' CR)');
      if (prezzoPagatoInput === null) return;

      const prezzoPagato = parseInt(prezzoPagatoInput, 10);
      if (isNaN(prezzoPagato) || prezzoPagato < 1) {
        alert('Inserisci un prezzo valido!');
        return;
      }

      if (prezzoPagato > remainingBudget) {
        alert('Crediti insufficienti!');
        return;
      }

      let esitoTitle = '';
      let esitoDesc = '';
      let accentColor = '';

      const rapporto = prezzoPagato / prezzoConsigliato;

      if (rapporto <= 0.85) {
        esitoTitle = '🔥 AFFARONE!';
        esitoDesc = 'Hai risparmiato ' + (prezzoConsigliato - prezzoPagato) + ' CR rispetto al valore ideale!';
        accentColor = '#00ffcc';
      } else if (rapporto >= 1.18) {
        esitoTitle = '⚠️ PACCO!';
        esitoDesc = 'L\'hai pagato ' + (prezzoPagato - prezzoConsigliato) + ' CR in più del prezzo consigliato!';
        accentColor = '#ff0055';
      } else {
        esitoTitle = '⚖️ GIUSTO!';
        esitoDesc = 'Acquisto equilibrato in linea con le quotazioni.';
        accentColor = '#ffcc00';
      }

      mostraModalValutazione(player, prezzoPagato, prezzoConsigliato, esitoTitle, esitoDesc, accentColor);

      myTeam.push({ ...player, prezzoPagato });
      remainingBudget -= prezzoPagato;
      updateUI();
    }

    function mostraModalValutazione(player, pagato, consigliato, titolo, desc, colore) {
      const existing = document.getElementById('fanta-eval-modal');
      if (existing) existing.remove();

      const modalHTML = 
        '<div id="fanta-eval-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(5, 7, 15, 0.9); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:99999;">' +
          '<div style="background:#0a0e17; border:2px solid ' + colore + '; box-shadow: 0 0 30px ' + colore + '; border-radius:12px; padding:30px; text-align:center; max-width:420px; width:90%; color:#fff; font-family:sans-serif;">' +
            '<h1 style="color:' + colore + '; margin:0 0 10px 0; font-size:28px;">' + titolo + '</h1>' +
            '<p style="font-size:18px; margin-bottom:15px; font-weight:bold;">' + player.nome.toUpperCase() + ' (' + player.squadra + ')</p>' +
            '<div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:8px; margin-bottom:15px; display:flex; justify-content:space-around;">' +
              '<div><span style="font-size:12px; color:#888; display:block;">PAGATO</span><span style="font-size:20px; font-weight:bold; color:' + colore + ';">' + pagato + ' CR</span></div>' +
              '<div style="border-left:1px solid rgba(255,255,255,0.1);"></div>' +
              '<div><span style="font-size:12px; color:#888; display:block;">CONSIGLIATO</span><span style="font-size:20px; font-weight:bold; color:#fff;">' + consigliato + ' CR</span></div>' +
            '</div>' +
            '<p style="font-size:14px; color:#ccc; margin-bottom:20px;">' + desc + '</p>' +
            '<button onclick="document.getElementById(\'fanta-eval-modal\').remove()" style="background:' + colore + '; color:#000; font-weight:bold; border:none; padding:12px 28px; border-radius:6px; cursor:pointer;">CONFERMA E CHIUDI</button>' +
          '</div>' +
        '</div>';

      document.body.insertAdjacentHTML('beforeend', modalHTML);
    }

    function updateUI() {
      const countRosa = document.getElementById('rosa-count');
      const creditiRim = document.getElementById('crediti-rimanenti');
      const spesiTot = document.getElementById('spesi-totale');
      const listRosa = document.getElementById('rosa-list');

      if (countRosa) countRosa.textContent = myTeam.length + '/25';
      if (creditiRim) creditiRim.textContent = remainingBudget + ' CR';
      if (spesiTot) spesiTot.textContent = (totalBudget - remainingBudget) + ' CR';

      if (listRosa) {
        if (myTeam.length === 0) {
          listRosa.innerHTML = '<p style="color:#666; font-style:italic;">Nessun giocatore acquistato.</p>';
        } else {
          let rosaRows = '';
          for (let i = 0; i < myTeam.length; i++) {
            rosaRows += '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);">' +
              '<div><strong style="color:#fff;">' + myTeam[i].nome + '</strong> <small style="color:#00f0ff;">(' + myTeam[i].ruolo + ')</small></div>' +
              '<span style="color:#ffcc00; font-weight:bold;">' + myTeam[i].prezzoPagato + ' CR</span>' +
            '</div>';
          }
          listRosa.innerHTML = rosaRows;
        }
      }

      renderPlayersTable();
    }

    function setFilter(role) {
      currentFilter = role;
      
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      renderPlayersTable();
    }

    function updateBudget(val) {
      totalBudget = parseInt(val, 10) || 1000;
      const giaSpesi = myTeam.reduce((acc, curr) => acc + curr.prezzoPagato, 0);
      remainingBudget = totalBudget - giaSpesi;
      updateUI();
    }
  </script>
</body>
</html>
