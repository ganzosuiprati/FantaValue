<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL PIPITA FANTAVALUE</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: #030509;
      color: #ffffff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BANNER PRINCIPALE E LOGO EL PIPITA */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px 15px;
      border-bottom: 2px solid #00f0ff;
      background: linear-gradient(90deg, rgba(7,10,18,0.9) 0%, rgba(0,240,255,0.05) 100%);
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* SILHOUETTE HIGUAIN TEMA NEON */
    .higuain-banner-img {
      height: 48px;
      width: auto;
      filter: drop-shadow(0 0 6px #00f0ff);
    }

    .app-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2.3fr 1fr;
      gap: 15px;
      flex: 1;
    }

    .card {
      background: #070a12;
      border: 1.5px solid #00f0ff;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }

    label {
      font-family: 'Orbitron', sans-serif;
      color: #00f0ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }

    input {
      background: #030509;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px;
      border-radius: 4px;
      width: 100%;
      font-weight: bold;
      font-size: 15px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .filter-btn {
      background: #030509;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 6px 16px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border-radius: 3px;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 0 10px #00f0ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      font-family: 'Orbitron', sans-serif;
      color: #00f0ff;
      font-size: 12px;
      border-bottom: 1.5px solid #00f0ff;
      padding: 10px 6px;
      text-align: left;
    }

    td {
      padding: 8px 6px;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-take {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 6px 10px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 11px;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
    }

    .btn-analysis {
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 4px 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-right: 4px;
    }

    .has-tooltip {
      position: relative;
    }

    .has-tooltip:hover .tooltip-box {
      display: block;
    }

    .tooltip-box {
      display: none;
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      background: #070a12;
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      border-radius: 6px;
      padding: 10px;
      z-index: 1000;
      font-size: 12px;
      color: #fff;
      pointer-events: none;
    }

    .team-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      margin-right: 8px;
    }

    /* FOOTER CREDITS */
    .app-footer {
      margin-top: 30px;
      padding: 15px;
      text-align: center;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      color: #888;
    }

    .app-footer a {
      color: #00f0ff;
      text-decoration: none;
      font-weight: bold;
    }

    .app-footer a:hover {
      text-shadow: 0 0 8px #00f0ff;
    }
  </style>
</head>
<body>

  <!-- BANNER HEADER -->
  <div class="app-header">
    <div class="brand-container">
      <svg class="higuain-banner-img" viewBox="0 0 100 100" fill="#00f0ff">
        <path d="M50 10 C30 10 20 25 20 40 C20 55 30 65 35 70 L30 90 L45 80 L50 95 L55 80 L70 90 L65 70 C70 65 80 55 80 40 C80 25 70 10 50 10 Z M40 35 A5 5 0 1 1 40 35 M60 35 A5 5 0 1 1 60 35 M40 55 Q50 65 60 55"/>
      </svg>
      <div class="app-title">⚡ EL PIPITA FANTAVALUE ⚡</div>
    </div>
    <div style="color: #00f0ff; font-family: 'Orbitron'; font-size: 12px;">SERIE A LIVE ALGORITHM</div>
  </div>

  <div class="grid-container">
    <div>
      <div class="card">
        <div style="display: flex; gap: 12px;">
          <div style="width: 120px;">
            <label>PARTECIPANTI</label>
            <input type="number" id="num-participants" value="10">
          </div>
          <div style="width: 140px;">
            <label>BUDGET TOTALE</label>
            <input type="number" id="total-budget-input" value="1000" onchange="updateBudget(this.value)">
          </div>
          <div style="flex: 1;">
            <label>RICERCA GIOCATORE / SQUADRA</label>
            <input type="text" id="search-input" placeholder="Es. Lautaro, Inter, Dimarco..." onkeyup="renderPlayersTable()">
          </div>
        </div>

        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('ALL', this)">TUTTI</button>
          <button class="filter-btn" onclick="setFilter('P', this)">POR</button>
          <button class="filter-btn" onclick="setFilter('D', this)">DIF</button>
          <button class="filter-btn" onclick="setFilter('C', this)">CEN</button>
          <button class="filter-btn" onclick="setFilter('A', this)">ATT</button>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h2 style="color: #ff0055; font-family: 'Orbitron'; font-size: 18px;">LISTA CALCIATORI REALI</h2>
          <span id="players-count" style="color: #ffcc00; font-family: 'Orbitron'; font-weight: bold; font-size: 16px;">0 GIOCATORI</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>GIOCATORE</th>
              <th>SQUADRA</th>
              <th>RUOLO</th>
              <th>FM</th>
              <th>TIT%</th>
              <th>PREZZO MAX</th>
              <th>AZIONI</th>
            </tr>
          </thead>
          <tbody id="players-table-body">
            <!-- TABELLA CARICATA DA JS -->
          </tbody>
        </table>
      </div>
    </div>

    <div>
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="color: #00f0ff; font-family: 'Orbitron'; font-size: 18px;">LA MIA ROSA</h2>
          <h2 id="rosa-count" style="color: #ffcc00; font-family: 'Orbitron'; font-size: 20px;">0/25</h2>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
          <span style="color:#aaa;">CREDITI RIMANENTI:</span>
          <strong id="crediti-rimanenti" style="color: #ffcc00; font-family: 'Orbitron'; font-size: 18px;">1000 CR</strong>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
          <span style="color:#aaa;">SPESI TOTALE:</span>
          <strong id="spesi-totale" style="color: #ff0055; font-family: 'Orbitron'; font-size: 18px;">0 CR</strong>
        </div>

        <hr style="border-color: rgba(0,240,255,0.2); margin-bottom: 12px;">

        <div id="rosa-list">
          <p style="color:#666; font-style:italic; font-size:14px;">Nessun giocatore acquistato.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CREDITI FOOTER -->
  <footer class="app-footer">
    Creato da <strong style="color:#fff;">Francesco Coppola</strong> | Instagram: <a href="https://instagram.com/ganzosuiprati" target="_blank">@ganzosuiprati</a>
  </footer>

  <script>
    let playersList = [];
    let myTeam = [];
    let totalBudget = 1000;
    let remainingBudget = 1000;
    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
      fetchPlayers();
    });

    async function fetchPlayers() {
      try {
        const response = await fetch('./players.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Errore caricamento JSON');
        const data = await response.json();
        
        playersList = data.map((p, index) => ({
          id: p.id || index + 1,
          ...p
        }));

        renderPlayersTable();
      } catch (error) {
        console.error('❌ Errore:', error);
      }
    }

    function calcolaPrezzoMax(pma, fantamedia) {
      const basePma = Number(pma) || 1;
      const fm = Number(fantamedia) || 6.0;
      let moltiplicatore = (totalBudget / 500);
      let stima = Math.round(basePma * 2.2 * moltiplicatore);

      if (fm >= 8.0) stima += Math.round(15 * moltiplicatore);
      else if (fm >= 7.5) stima += Math.round(8 * moltiplicatore);

      return Math.max(1, stima);
    }

    function renderPlayersTable() {
      const container = document.getElementById('players-table-body');
      const countDisplay = document.getElementById('players-count');
      const searchInput = document.getElementById('search-input')?.value.toLowerCase() || '';

      if (!container) return;

      let filtered = playersList.filter(p => {
        const matchRole = currentFilter === 'ALL' || p.ruolo === currentFilter;
        const matchSearch = p.nome.toLowerCase().includes(searchInput) || p.squadra.toLowerCase().includes(searchInput);
        const notTaken = !myTeam.some(taken => taken.id === p.id);
        return matchRole && matchSearch && notTaken;
      });

      filtered.sort((a, b) => calcolaPrezzoMax(b.pma, b.fantamedia) - calcolaPrezzoMax(a.pma, a.fantamedia));

      if (countDisplay) {
        countDisplay.textContent = filtered.length + ' GIOCATORI';
      }

      let htmlRows = '';
      for (let i = 0; i < filtered.length; i++) {
        const player = filtered[i];
        const prezzoMax = calcolaPrezzoMax(player.pma, player.fantamedia);
        const logoHTML = player.stemma 
          ? '<img src="' + player.stemma + '" class="team-logo" alt="' + player.squadra + '">' 
          : '';

        const affaroneMax = Math.round(prezzoMax * 0.85);
        const paccoMin = Math.round(prezzoMax * 1.18);

        htmlRows += '<tr style="border-bottom: 1px solid rgba(0, 240, 255, 0.1);">' +
          '<td style="display:flex; align-items:center;">' + logoHTML + '<span style="color:#fff; font-weight:700;">' + player.nome.toUpperCase() + '</span></td>' +
          '<td style="color:#00f0ff;">' + player.squadra + '</td>' +
          '<td style="color:#ff0055; font-weight:bold;">' + player.ruolo + '</td>' +
          '<td>' + Number(player.fantamedia).toFixed(1) + '</td>' +
          '<td>' + player.titolarita + '%</td>' +
          '<td style="color:#ffcc00; font-family:\'Orbitron\'; font-weight:bold;">' + prezzoMax + ' CR</td>' +
          '<td>' +
            '<div class="has-tooltip" style="display:inline-block;">' +
              '<button class="btn-analysis">ANALISI</button>' +
              '<div class="tooltip-box">' +
                '<strong style="color:#00f0ff;">TARGET PREZZO:</strong><br>' +
                '🔥 Affarone: ≤ ' + affaroneMax + ' CR<br>' +
                '⚖️ Equo: ' + (affaroneMax + 1) + ' - ' + (paccoMin - 1) + ' CR<br>' +
                '⚠️ Pacco: ≥ ' + paccoMin + ' CR' +
              '</div>' +
            '</div>' +
            '<button class="btn-take" onclick="valutaEDAcquista(' + player.id + ')">+ PRENDI</button>' +
          '</td>' +
        '</tr>';
      }

      container.innerHTML = htmlRows;
    }

    function valutaEDAcquista(playerId) {
      const player = playersList.find(p => p.id === playerId);
      if (!player) return;

      const prezzoConsigliato = calcolaPrezzoMax(player.pma, player.fantamedia);
      const prezzoPagatoInput = prompt('A quanto hai acquistato ' + player.nome.toUpperCase() + '?\n(Prezzo Consigliato: ' + prezzoConsigliato + ' CR)');
      
      if (prezzoPagatoInput === null) return;
      const prezzoPagato = parseInt(prezzoPagatoInput, 10);
      
      if (isNaN(prezzoPagato) || prezzoPagato < 1) {
        alert('Inserisci un prezzo valido!');
        return;
      }

      if (prezzoPagato > remainingBudget) {
        alert('Crediti insufficienti!');
        return;
      }

      myTeam.push({ ...player, prezzoPagato });
      remainingBudget -= prezzoPagato;
      updateUI();
    }

    function updateUI() {
      const countRosa = document.getElementById('rosa-count');
      const creditiRim = document.getElementById('crediti-rimanenti');
      const spesiTot = document.getElementById('spesi-totale');
      const listRosa = document.getElementById('rosa-list');

      if (countRosa) countRosa.textContent = myTeam.length + '/25';
      if (creditiRim) creditiRim.textContent = remainingBudget + ' CR';
      if (spesiTot) spesiTot.textContent = (totalBudget - remainingBudget) + ' CR';

      if (listRosa) {
        if (myTeam.length === 0) {
          listRosa.innerHTML = '<p style="color:#666; font-style:italic; font-size:14px;">Nessun giocatore acquistato.</p>';
        } else {
          let rosaRows = '';
          for (let i = 0; i < myTeam.length; i++) {
            rosaRows += '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">' +
              '<div><strong style="color:#fff;">' + myTeam[i].nome + '</strong> <small style="color:#00f0ff;">(' + myTeam[i].ruolo + ')</small></div>' +
              '<span style="color:#ffcc00; font-family:\'Orbitron\'; font-weight:bold;">' + myTeam[i].prezzoPagato + ' CR</span>' +
            '</div>';
          }
          listRosa.innerHTML = rosaRows;
        }
      }

      renderPlayersTable();
    }

    function setFilter(role, btnElement) {
      currentFilter = role;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderPlayersTable();
    }

    function updateBudget(val) {
      totalBudget = parseInt(val, 10) || 1000;
      const giaSpesi = myTeam.reduce((acc, curr) => acc + curr.prezzoPagato, 0);
      remainingBudget = totalBudget - giaSpesi;
      updateUI();
    }
  </script>
</body>
</html>
