<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My FantaCola 🥤 Live Matchday</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cola-red: #e61c24;
      --cola-dark-red: #9e0b11;
      --cola-black: #120304;
      --soda-cream: #fff8e7;
      --fizz-yellow: #ffeb3b;
      --card-bg: #1c0608;
      --border-red: #5e0e12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--cola-black);
      color: var(--soda-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: linear-gradient(180deg, #2b080a 0%, var(--cola-black) 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(230, 28, 36, 0.3);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, var(--cola-red), var(--cola-dark-red));
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--fizz-yellow);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: var(--soda-cream);
      text-shadow: 2px 2px 0px var(--cola-black);
    }

    .matchday-badge {
      background: var(--fizz-yellow);
      color: var(--cola-black);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 80px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .soda-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-red);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card-header {
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      color: var(--fizz-yellow);
      margin-bottom: 10px;
    }

    .match-box {
      background: #2a0a0d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .teams-header {
      text-align: center;
      font-weight: 700;
      color: var(--soda-cream);
      font-size: 15px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border-red);
      padding-bottom: 6px;
    }

    .lineup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
    }

    .team-col h4 {
      color: var(--cola-red);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .player-line { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .ballottaggio-tag {
      background: rgba(255, 235, 59, 0.15);
      border: 1px solid var(--fizz-yellow);
      color: var(--fizz-yellow);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 8px;
      font-weight: 600;
    }

    .role-section {
      margin-bottom: 12px;
      background: #23080a;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-red);
    }

    .role-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--fizz-yellow);
      margin-bottom: 6px;
    }

    .player-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #120304;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .chip-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-top { background: #2e7d32; color: #fff; }
    .status-ok { background: #1565c0; color: #fff; }
    .status-bench { background: #e65100; color: #fff; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #120304;
      border-top: 1.5px solid var(--border-red);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #8c6b6d;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 33%;
    }

    .nav-item .icon { font-size: 18px; }
    .nav-item.active { color: var(--fizz-yellow); }
  </style>
</head>
<body>

  <div class="app-frame">
    
    <header>
      <div class="brand-title">🥤 My FantaCola</div>
      <div class="matchday-badge" id="giornataBadge">28ª GIORNATA</div>
    </header>

    <div class="content-area">

      <!-- TAB 1: PROBABILI FORMAZIONI SERIE A -->
      <div class="tab-content active" id="tab-formazioni">
        <div class="soda-card">
          <div class="card-header">📋 PROBABILI FORMAZIONI LIVE</div>
          <div id="formazioniList"></div>
        </div>
      </div>

      <!-- TAB 2: LA TUA ROSA (25 GIOCATORI) -->
      <div class="tab-content" id="tab-rosa">
        <div class="soda-card">
          <div class="card-header">👕 LA TUA ROSA (25 GIOCATORI)</div>
          <p style="font-size:11px; color:#c7a3a5; margin-bottom:12px;">I consigli per la tua squadra in base alle probabili formazioni ufficiali di giornata.</p>
          
          <div id="rosaContainer"></div>
        </div>
      </div>

      <!-- TAB 3: NEWS & CONSIGLI -->
      <div class="tab-content" id="tab-news">
        <div class="soda-card">
          <div class="card-header">📰 NEWS & STRATEGIA</div>
          <div id="newsList"></div>
        </div>
      </div>

    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-formazioni', this)">
        <span class="icon">📋</span>
        <span>Formazioni</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-rosa', this)">
        <span class="icon">👕</span>
        <span>Mio Team (25)</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-news', this)">
        <span class="icon">🔥</span>
        <span>News & Top</span>
      </div>
    </nav>

  </div>

  <script>
    // DATI STATICI INTEGRATI PER EVITARE SCHERMATE VUOTE
    const initialData = {
      giornata: 28,
      // La tua rosa personalizzata di 25 giocatori
      mia_rosa: {
        P: [
          { nome: "Sommer", squadra: "Inter", status: "Consigliato Titular", level: "top" },
          { nome: "Martinez", squadra: "Inter", status: "Panchina", level: "bench" },
          { nome: "Di Gennaro", squadra: "Inter", status: "Panchina", level: "bench" }
        ],
        D: [
          { nome: "Dimarco", squadra: "Inter", status: "Titolare (Top)", level: "top" },
          { nome: "Theo Hernandez", squadra: "Milan", status: "Titolare (Top)", level: "top" },
          { nome: "Buongiorno", squadra: "Napoli", status: "Titolare", level: "ok" },
          { nome: "Bastoni", squadra: "Inter", status: "Titolare", level: "ok" },
          { nome: "Cambiaso", squadra: "Juventus", status: "Titolare", level: "ok" },
          { nome: "Pavard", squadra: "Inter", status: "Ballottaggio (60%)", level: "bench" },
          { nome: "Gatti", squadra: "Juventus", status: "Titolare", level: "ok" },
          { nome: "Darmian", squadra: "Inter", status: "Ballottaggio (50%)", level: "bench" }
        ],
        C: [
          { nome: "Calhanoglu", squadra: "Inter", status: "Rigorista (Top)", level: "top" },
          { nome: "Pulisic", squadra: "Milan", status: "Titolare (Top)", level: "top" },
          { nome: "Barella", squadra: "Inter", status: "Titolare", level: "ok" },
          { nome: "Koopmeiners", squadra: "Juventus", status: "Titolare", level: "ok" },
          { nome: "McTominay", squadra: "Napoli", status: "Titolare", level: "ok" },
          { nome: "Reijnders", squadra: "Milan", status: "Titolare", level: "ok" },
          { nome: "Frattesi", squadra: "Inter", status: "Subentrante", level: "bench" },
          { nome: "Fofana", squadra: "Milan", status: "Titolare", level: "ok" }
        ],
        A: [
          { nome: "Lautaro Martinez", squadra: "Inter", status: "Titolare (Top)", level: "top" },
          { nome: "Lukaku", squadra: "Napoli", status: "Titolare (Top)", level: "top" },
          { nome: "Thuram", squadra: "Inter", status: "Titolare", level: "ok" },
          { nome: "Leao", squadra: "Milan", status: "Titolare", level: "ok" },
          { nome: "Vlahovic", squadra: "Juventus", status: "Titolare", level: "ok" },
          { nome: "Morata", squadra: "Milan", status: "Ballottaggio", level: "bench" }
        ]
      },
      partite: [
        {
          match: "INTER vs JUVENTUS",
          orario: "Sabato 20:45",
          squadre: {
            casa: { nome: "INTER", titolari: ["Sommer", "Pavard", "Acerbi", "Bastoni", "Darmian", "Barella", "Calhanoglu", "Mkhitaryan", "Dimarco", "Thuram", "Lautaro"] },
            trasferta: { nome: "JUVENTUS", titolari: ["Perin", "Gatti", "Bremer", "Danilo", "Cambiaso", "Locatelli", "Thuram", "Kostic", "Yildiz", "Koopmeiners", "Vlahovic"] }
          }
        },
        {
          match: "MILAN vs NAPOLI",
          orario: "Domenica 20:45",
          squadre: {
            casa: { nome: "MILAN", titolari: ["Maignan", "Emerson", "Tomori", "Pavlovic", "Theo", "Fofana", "Reijnders", "Pulisic", "Loftus", "Leao", "Morata"] },
            trasferta: { nome: "NAPOLI", titolari: ["Caprile", "Di Lorenzo", "Rrahmani", "Buongiorno", "Olivera", "Anguissa", "Lobotka", "McTominay", "Politano", "Lukaku", "Kvaratskhelia"] }
          }
        }
      ],
      news: [
        { tipo: "CONSIGLIATI", titolo: "Modulo Ideale", testo: "In base alla tua rosa ti consigliamo un 3-4-3 schierando Lautaro, Lukaku e Thuram davanti." },
        { tipo: "RIENTRI", titolo: "Formazioni Ufficiali", testo: "Nessun infortunato grave nella tua rosa per questa 28ª giornata." }
      ]
    };

    function init() {
      // 1. Render Formazioni
      const formContainer = document.getElementById('formazioniList');
      formContainer.innerHTML = '';
      initialData.partite.forEach(p => {
        const box = document.createElement('div');
        box.className = 'match-box';
        box.innerHTML = `
          <div class="teams-header">${p.match} <span style="font-size:11px; color:var(--fizz-yellow);">(${p.orario})</span></div>
          <div class="lineup-grid">
            <div class="team-col">
              <h4>${p.squadre.casa.nome}</h4>
              ${p.squadre.casa.titolari.map(t => `<div class="player-line">• ${t}</div>`).join('')}
            </div>
            <div class="team-col">
              <h4>${p.squadre.trasferta.nome}</h4>
              ${p.squadre.trasferta.titolari.map(t => `<div class="player-line">• ${t}</div>`).join('')}
            </div>
          </div>
        `;
        formContainer.appendChild(box);
      });

      // 2. Render Rosa (25 Giocatori)
      const rosaContainer = document.getElementById('rosaContainer');
      rosaContainer.innerHTML = '';

      const ruoliMap = { P: "PORTIERI (3)", D: "DIFENSORI (8)", C: "CENTROCAMPISTI (8)", A: "ATTACCANTI (6)" };

      for (const [ruolo, lista] of Object.entries(initialData.mia_rosa)) {
        const sec = document.createElement('div');
        sec.className = 'role-section';
        
        let htmlChips = '';
        lista.forEach(p => {
          htmlChips += `
            <div class="player-chip">
              <span><strong>${p.nome}</strong> <small style="color:#a38284;">(${p.squadra})</small></span>
              <span class="chip-status status-${p.level}">${p.status}</span>
            </div>
          `;
        });

        sec.innerHTML = `
          <div class="role-title">${ruoliMap[ruolo]}</div>
          ${htmlChips}
        `;
        rosaContainer.appendChild(sec);
      }

      // 3. Render News
      const newsContainer = document.getElementById('newsList');
      newsContainer.innerHTML = '';
      initialData.news.forEach(n => {
        newsContainer.innerHTML += `
          <div style="margin-bottom:12px;">
            <strong style="color:var(--fizz-yellow); font-size:13px;">${n.titolo}</strong>
            <p style="font-size:12px; color:#c7a3a5;">${n.testo}</p>
          </div>
        `;
      });
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
