<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My FantaCola 🥤 Live Matchday</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cola-red: #e61c24;
      --cola-dark-red: #9e0b11;
      --cola-black: #120304;
      --soda-cream: #fff8e7;
      --fizz-yellow: #ffeb3b;
      --card-bg: #1c0608;
      --border-red: #5e0e12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--cola-black);
      color: var(--soda-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: linear-gradient(180deg, #2b080a 0%, var(--cola-black) 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(230, 28, 36, 0.3);
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, var(--cola-red), var(--cola-dark-red));
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--fizz-yellow);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: var(--soda-cream);
      text-shadow: 2px 2px 0px var(--cola-black);
    }

    .matchday-badge {
      background: var(--fizz-yellow);
      color: var(--cola-black);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 80px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .soda-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-red);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card-header {
      font-family: 'Fredoka One', cursive;
      font-size: 16px;
      color: var(--fizz-yellow);
      margin-bottom: 10px;
    }

    .match-box {
      background: #2a0a0d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .teams-header {
      text-align: center;
      font-weight: 700;
      color: var(--soda-cream);
      font-size: 15px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border-red);
      padding-bottom: 6px;
    }

    .lineup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
    }

    .team-col h4 {
      color: var(--cola-red);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .player-line { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .ballottaggio-tag {
      background: rgba(255, 235, 59, 0.15);
      border: 1px solid var(--fizz-yellow);
      color: var(--fizz-yellow);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 8px;
      font-weight: 600;
    }

    .field-container {
      background: linear-gradient(180deg, #184e28 0%, #0d3018 100%);
      border: 2px solid #2e8b57;
      border-radius: 14px;
      padding: 15px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      margin-bottom: 15px;
    }

    .module-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-module {
      flex: 1;
      background: #2b080a;
      border: 1px solid var(--border-red);
      color: var(--soda-cream);
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-module.active {
      background: var(--cola-red);
      border-color: var(--fizz-yellow);
      color: #fff;
    }

    .recommended-box {
      background: rgba(230, 28, 36, 0.15);
      border: 1px solid var(--cola-red);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .news-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .badge-RIENTRI { background: #2e7d32; color: #fff; }
    .badge-CONSIGLIATI { background: #f57f17; color: #fff; }
    .badge-INFORTUNI { background: #c62828; color: #fff; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: #120304;
      border-top: 1.5px solid var(--border-red);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #8c6b6d;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      width: 25%;
    }

    .nav-item .icon { font-size: 18px; }
    .nav-item.active { color: var(--fizz-yellow); }
    
    .error-msg {
      padding: 12px;
      background: rgba(230, 28, 36, 0.2);
      border: 1px solid var(--cola-red);
      border-radius: 10px;
      font-size: 12px;
      color: #ff8a80;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-frame">
    
    <header>
      <div class="brand-title">🥤 My FantaCola</div>
      <div class="matchday-badge" id="giornataBadge">LIVE</div>
    </header>

    <div class="content-area">

      <!-- TAB 1: PROBABILI FORMAZIONI -->
      <div class="tab-content active" id="tab-formazioni">
        <div class="soda-card">
          <div class="card-header">📋 LIVE PROBABILI FORMAZIONI</div>
          <div id="formazioniList">Caricamento dati live in corso...</div>
        </div>
      </div>

      <!-- TAB 2: SCHIERA TEAM -->
      <div class="tab-content" id="tab-schiera">
        <div class="soda-card">
          <div class="card-header">🛡️ SCHIERA FORMAZIONE</div>
          
          <div class="recommended-box">
            💡 <strong>Modulo Consigliato:</strong> <span style="color:var(--fizz-yellow);">3-4-3</span>
          </div>

          <div style="font-size: 11px; margin-bottom: 6px; color:#a38284;">Scegli Modulo:</div>
          <div class="module-selector">
            <button class="btn-module active" onclick="setModule('3-4-3', this)">3-4-3</button>
            <button class="btn-module" onclick="setModule('4-3-3', this)">4-3-3</button>
            <button class="btn-module" onclick="setModule('3-5-2', this)">3-5-2</button>
            <button class="btn-module" onclick="setModule('4-4-2', this)">4-4-2</button>
          </div>

          <div class="field-container" id="fieldGraphic"></div>
        </div>
      </div>

      <!-- TAB 3: NEWS & TOP -->
      <div class="tab-content" id="tab-news">
        <div class="soda-card">
          <div class="card-header">📰 ULTIME NEWS & CONSIGLI</div>
          <div id="newsList">Caricamento news...</div>
        </div>

        <div class="soda-card">
          <div class="card-header">⭐ CONSIGLIATI PER RUOLO</div>
          <div id="consigliatiList" style="font-size: 13px;">Caricamento consigliati...</div>
        </div>
      </div>

    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tab-formazioni', this)">
        <span class="icon">📋</span>
        <span>Formazioni</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-schiera', this)">
        <span class="icon">👕</span>
        <span>Mio Team</span>
      </div>
      <div class="nav-item" onclick="switchTab('tab-news', this)">
        <span class="icon">🔥</span>
        <span>News & Top</span>
      </div>
    </nav>

  </div>

  <script>
    async function loadData() {
      try {
        // Fetch dinamico con timestamp per evitare la cache di GitHub Pages
        const response = await fetch('./fantacola_data.json?t=' + new Date().getTime());
        
        if (!response.ok) {
          throw new Error("File fantacola_data.json non ancora generato.");
        }

        const appData = await response.json();
        renderUI(appData);

      } catch (err) {
        console.warn("Attesa aggiornamento dati:", err);
        document.getElementById('formazioniList').innerHTML = `
          <div class="error-msg">
            ⚙️ <strong>Aggiornamento in corso...</strong><br>
            La GitHub Action sta generando i dati aggiornati di oggi. Ricarica tra un minuto!
          </div>
        `;
      }
    }

    function renderUI(appData) {
      if (appData.giornata) {
        document.getElementById('giornataBadge').textContent = `${appData.giornata}ª GIORNATA`;
      }

      // 1. Render Formazioni
      const formContainer = document.getElementById('formazioniList');
      formContainer.innerHTML = '';

      if (appData.partite && appData.partite.length > 0) {
        appData.partite.forEach(p => {
          const matchBox = document.createElement('div');
          matchBox.className = 'match-box';
          
          let ballottaggiHtml = '';
          if (p.squadre.casa.ballottaggi || p.squadre.trasferta.ballottaggi) {
            const list = [...(p.squadre.casa.ballottaggi || []), ...(p.squadre.trasferta.ballottaggi || [])];
            list.forEach(b => {
              ballottaggiHtml += `<div class="ballottaggio-tag">⚔️ Ballottaggio: ${b}</div>`;
            });
          }

          matchBox.innerHTML = `
            <div class="teams-header">${p.match} <span style="font-size:11px; color:var(--fizz-yellow);">(${p.orario || 'TBA'})</span></div>
            <div class="lineup-grid">
              <div class="team-col">
                <h4>${p.squadre.casa.nome} (${p.squadre.casa.modulo_probabile || ''})</h4>
                ${p.squadre.casa.titolari ? p.squadre.casa.titolari.map(pt => `<div class="player-line">• ${pt}</div>`).join('') : ''}
              </div>
              <div class="team-col">
                <h4>${p.squadre.trasferta.nome} (${p.squadre.trasferta.modulo_probabile || ''})</h4>
                ${p.squadre.trasferta.titolari ? p.squadre.trasferta.titolari.map(pt => `<div class="player-line">• ${pt}</div>`).join('') : ''}
              </div>
            </div>
            ${ballottaggiHtml}
          `;
          formContainer.appendChild(matchBox);
        });
      }

      // 2. Render News
      const newsContainer = document.getElementById('newsList');
      newsContainer.innerHTML = '';
      if (appData.news && appData.news.length > 0) {
        appData.news.forEach(n => {
          const item = document.createElement('div');
          item.style.marginBottom = "12px";
          item.innerHTML = `
            <span class="news-badge badge-${n.tipo}">${n.tipo}</span>
            <strong style="display:block; font-size:14px; color:#fff;">${n.titolo}</strong>
            <p style="font-size:12px; color:#c7a3a5;">${n.testo}</p>
          `;
          newsContainer.appendChild(item);
        });
      }

      // 3. Render Consigliati
      if (appData.consigliati_ruolo) {
        document.getElementById('consigliatiList').innerHTML = `
          <p><strong>🧤 Portieri:</strong> ${appData.consigliati_ruolo.P ? appData.consigliati_ruolo.P.join(', ') : '-'}</p>
          <p style="margin-top:6px;"><strong>🛡️ Difensori:</strong> ${appData.consigliati_ruolo.D ? appData.consigliati_ruolo.D.join(', ') : '-'}</p>
          <p style="margin-top:6px;"><strong>⚙️ Centrocampisti:</strong> ${appData.consigliati_ruolo.C ? appData.consigliati_ruolo.C.join(', ') : '-'}</p>
          <p style="margin-top:6px;"><strong>⚽ Attaccanti:</strong> ${appData.consigliati_ruolo.A ? appData.consigliati_ruolo.A.join(', ') : '-'}</p>
        `;
      }

      renderField('3-4-3');
    }

    function renderField(modulo) {
      const parts = modulo.split('-');
      document.getElementById('fieldGraphic').innerHTML = `
        <div style="text-align:center; color:#fff; font-size:11px; font-weight:bold;">ATTACCO (${parts[2]})</div>
        <div style="display:flex; justify-content:space-around; color:var(--fizz-yellow); font-size:18px;">⚽ ⚽ ⚽</div>
        <div style="text-align:center; color:#fff; font-size:11px; font-weight:bold;">CENTROCAMPO (${parts[1]})</div>
        <div style="display:flex; justify-content:space-around; color:#fff; font-size:18px;">🏃 🏃 🏃 🏃</div>
        <div style="text-align:center; color:#fff; font-size:11px; font-weight:bold;">DIFESA (${parts[0]})</div>
        <div style="display:flex; justify-content:space-around; color:#2196f3; font-size:18px;">🛡️ 🛡️ 🛡️</div>
        <div style="text-align:center; color:#ff9800; font-size:18px;">🧤</div>
      `;
    }

    function setModule(mod, btn) {
      document.querySelectorAll('.btn-module').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderField(mod);
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    // Inizializzazione al caricamento
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
