<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaCola Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      --role-p: #eab308;
      --role-d: #3b82f6;
      --role-c: #10b981;
      --role-a: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .logo span { color: var(--accent-red); }

    .badge-live {
      background: rgba(239, 68, 68, 0.2);
      color: var(--accent-red);
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--accent-red);
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .match-header {
      background: #0f172a;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .match-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
    }

    .team-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
      color: var(--text-main);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
    }

    .player-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }

    .player-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .player-name-group {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .role-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
      color: #fff;
      min-width: 18px;
      text-align: center;
    }

    .role-P { background: var(--role-p); color: #000; }
    .role-D { background: var(--role-d); }
    .role-C { background: var(--role-c); }
    .role-A { background: var(--role-a); }

    .player-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .perc-val {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .bar-bg {
      width: 100%;
      height: 5px;
      background: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .fill-high { background: #22c55e; }
    .fill-mid { background: #f59e0b; }
    .fill-low { background: #ef4444; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">My <span>FantaCola</span></div>
      <div class="badge-live">LIVE</div>
    </header>

    <div id="matches-list">
      <p style="text-align: center; color: var(--text-muted); font-size: 13px;">Caricamento formazioni...</p>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch('./fantacola_data.json?t=' + Date.now());
        const data = await res.json();
        const container = document.getElementById('matches-list');
        container.innerHTML = '';

        if (!data.partite || data.partite.length === 0) {
          container.innerHTML = '<p style="text-align:center;">Nessun dato disponibile.</p>';
          return;
        }

        data.partite.forEach(match => {
          const card = document.createElement('div');
          card.className = 'match-card';

          const renderList = (players) => {
            if (!players || players.length === 0) return '<p style="font-size:11px; color:var(--text-muted);">In attesa</p>';
            return players.map(p => {
              const perc = p.percentuale || 50;
              const fillClass = perc >= 75 ? 'fill-high' : (perc >= 50 ? 'fill-mid' : 'fill-low');
              const role = p.ruolo || 'C';

              return `
                <div class="player-row">
                  <div class="player-meta">
                    <div class="player-name-group">
                      <span class="role-badge role-${role}">${role}</span>
                      <span class="player-name">${p.nome}</span>
                    </div>
                    <span class="perc-val">${perc}%</span>
                  </div>
                  <div class="bar-bg">
                    <div class="bar-fill ${fillClass}" style="width: ${perc}%"></div>
                  </div>
                </div>
              `;
            }).join('');
          };

          card.innerHTML = `
            <div class="match-header">${match.match}</div>
            <div class="match-body">
              <div>
                <div class="team-title">${match.squadra_casa}</div>
                ${renderList(match.formazione_casa)}
              </div>
              <div>
                <div class="team-title">${match.squadra_trasferta}</div>
                ${renderList(match.formazione_trasferta)}
              </div>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        document.getElementById('matches-list').innerHTML = '<p style="text-align:center; color:var(--accent-red);">Errore nel caricamento dei dati.</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
