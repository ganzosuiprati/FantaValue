<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanta Value 2000 - Retrogaming Auction Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b14;
      --panel-bg: rgba(10, 20, 38, 0.85);
      --neon-blue: #00f0ff;
      --neon-magenta: #ff0055;
      --neon-yellow: #ffea00;
      --neon-green: #00ff66;
      --text-main: #e0f7ff;
      --border-color: #1a3a60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: linear-gradient(90deg, #02060d 0%, #0a1b36 50%, #02060d 100%);
      border-bottom: 2px solid var(--neon-blue);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .season-badge {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      background: var(--neon-magenta);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 8px var(--neon-magenta);
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 18px;
      color: #fff;
      text-shadow: 2px 2px var(--neon-blue);
      letter-spacing: -1px;
    }

    .developer-credits {
      font-size: 12px;
      color: #8ab4f8;
      text-align: right;
    }

    .developer-credits span {
      color: var(--neon-blue);
      font-weight: 700;
    }

    /* MAIN CONTENT */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      position: relative;
    }

    /* LEFT PANEL: FILTERS & LISTONE */
    .left-panel {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow: hidden;
    }

    .controls-grid {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.05);
    }

    .inputs-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-blue);
      text-transform: uppercase;
    }

    .input-group input, .input-group select {
      background: #020a16;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .search-input {
      flex: 1;
    }

    .filter-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: #6c8cae;
      text-transform: uppercase;
      margin-right: 5px;
    }

    .btn-filter {
      background: #08162a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-filter:hover, .btn-filter.active {
      background: var(--neon-blue);
      color: #000;
      box-shadow: 0 0 10px var(--neon-blue);
      border-color: var(--neon-blue);
    }

    .btn-tag {
      border-color: #2a4c7e;
    }

    .btn-tag.active {
      background: var(--neon-yellow);
      color: #000;
      box-shadow: 0 0 10px var(--neon-yellow);
      border-color: var(--neon-yellow);
    }

    /* TABLE */
    .table-container {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow-y: auto;
      position: relative;
    }

    .listone-header {
      background: #061325;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .listone-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      color: var(--neon-magenta);
    }

    .player-count {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      color: var(--neon-blue);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #040c18;
      color: #6c8cae;
      font-size: 11px;
      padding: 10px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 37px;
      z-index: 9;
    }

    td {
      padding: 8px 10px;
      border-bottom: 1px solid #0d223a;
      font-size: 14px;
      font-weight: 600;
    }

    tr:hover {
      background: rgba(0, 240, 255, 0.05);
    }

    tr.draggable-row {
      cursor: grab;
    }

    .role-badge {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
    }
    .role-P { background: #e67e22; color: #fff; }
    .role-D { background: #27ae60; color: #fff; }
    .role-C { background: #2980b9; color: #fff; }
    .role-A { background: #c0392b; color: #fff; }

    .price-tag {
      color: var(--neon-yellow);
      font-weight: 700;
    }

    .tag-badge {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: 4px;
      background: #102a45;
      color: var(--neon-blue);
      border: 1px solid var(--neon-blue);
    }

    .btn-action {
      background: var(--neon-magenta);
      border: none;
      color: #fff;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: 0 0 5px var(--neon-magenta);
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    /* RIGHT PANEL: SIDEBAR ROSA */
    .right-panel {
      width: 340px;
      background: #030a14;
      border-left: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .right-panel.collapsed {
      margin-right: -340px;
    }

    .toggle-sidebar-btn {
      position: absolute;
      left: -28px;
      top: 15px;
      width: 28px;
      height: 40px;
      background: var(--border-color);
      border: 1px solid var(--neon-blue);
      border-right: none;
      color: var(--neon-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px 0 0 4px;
      font-weight: bold;
    }

    .sidebar-header {
      padding: 12px 15px;
      background: #061325;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-title {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      color: #fff;
    }

    .budget-summary {
      padding: 15px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .budget-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .budget-value {
      color: var(--neon-green);
    }

    .spent-value {
      color: var(--neon-magenta);
    }

    .rosa-list {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rosa-item {
      background: #06162d;
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rosa-item-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: #ff4757;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <span class="season-badge">SEASON 2026</span>
      <h1>FANTA VALUE 2000</h1>
    </div>
    <div class="developer-credits">
      DEVELOPER & LEAD<br>
      Francesco Coppola | <span>@ganzosuiprati</span>
    </div>
  </header>

  <div class="app-container">
    
    <!-- PANNELLO SINISTRO -->
    <div class="left-panel">
      
      <!-- CONTROLLI E FILTRI -->
      <div class="controls-grid">
        <div class="inputs-row">
          <div class="input-group">
            <label>Partecipanti Lega</label>
            <input type="number" id="numTeams" value="8" min="4" max="16" style="width: 70px;">
          </div>
          <div class="input-group">
            <label>Budget Totale (CR)</label>
            <input type="number" id="totalBudget" value="1000" step="50" style="width: 90px;">
          </div>
          <div class="input-group search-input">
            <label>Ricerca Giocatore / Squadra</label>
            <input type="text" id="searchInput" placeholder="Es. Svilar, Inter, Dimarco..">
          </div>
        </div>

        <!-- FILTRI RUOLO -->
        <div class="filter-section">
          <span class="filter-label">Filtra per Ruolo:</span>
          <button class="btn-filter active" data-role="ALL">TUTTI</button>
          <button class="btn-filter" data-role="P">POR</button>
          <button class="btn-filter" data-role="D">DIF</button>
          <button class="btn-filter" data-role="C">CEN</button>
          <button class="btn-filter" data-role="A">ATT</button>
        </div>

        <!-- FILTRI SPECIALI -->
        <div class="filter-section">
          <span class="filter-label">Filtri Speciali:</span>
          <button class="btn-filter btn-tag" data-tag="TOP">🔥 TOP REPARTO</button>
          <button class="btn-filter btn-tag" data-tag="TITOLARE">🛡️ TITOLARI</button>
          <button class="btn-filter btn-tag" data-tag="SCOMMESSA">💡 SCOMMESSE</button>
          <button class="btn-filter btn-tag" data-tag="RIGORISTA">⚽ RIGORISTI</button>
          <button class="btn-filter btn-tag" data-tag="JOLLY">🃏 JOLLY</button>
        </div>
      </div>

      <!-- TABELLA GIOCATORI -->
      <div class="table-container" id="dropTargetRemove">
        <div class="listone-header">
          <span class="listone-title">LISTONE CALCIATORI (TRASCINA IN ROSA PER ACQUISTARE)</span>
          <span class="player-count" id="playerCount">0 GIOCATORI</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Giocatore</th>
              <th>Squadra</th>
              <th>Ruolo</th>
              <th>FM</th>
              <th>Tit%</th>
              <th>Prezzo Max</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="playerTableBody">
            <!-- Righe inserite via JS -->
          </tbody>
        </table>
      </div>

    </div>

    <!-- PANNELLO DESTRO (SIDEBAR ROSA) -->
    <div class="right-panel" id="sidebarRosa">
      <button class="toggle-sidebar-btn" id="toggleSidebar">◀</button>
      
      <div class="sidebar-header">
        <span class="sidebar-title">LA MIA ROSA</span>
        <span class="player-count" id="rosaCount">0/25</span>
      </div>

      <div class="budget-summary">
        <div class="budget-row">
          <span>CREDITI RIMANENTI:</span>
          <span class="budget-value" id="remainingBudget">1000 CR</span>
        </div>
        <div class="budget-row">
          <span>SPESI TOTALE:</span>
          <span class="spent-value" id="spentBudget">0 CR</span>
        </div>
      </div>

      <div class="rosa-list" id="rosaList">
        <!-- Calciatori acquistati -->
      </div>
    </div>

  </div>

  <script>
    let allPlayers = [];
    let myRosa = [];
    let activeRoleFilter = 'ALL';
    let activeTagFilter = null;

    // Generatore dinamico di Tag basato su statistiche
    function generateAutoTags(player) {
      const tags = player.tags || [];
      
      // Dynamic TOP threshold depending on position
      const topThreshold = player.ruolo === 'A' ? 70 : (player.ruolo === 'C' ? 35 : 30);
      if (player.pma >= topThreshold || player.fantamedia >= 8.0) {
        if (!tags.includes('TOP')) tags.push('TOP');
      }
      
      if (player.titolarita >= 80) {
        if (!tags.includes('TITOLARE')) tags.push('TITOLARE');
      }
      
      if (player.pma >= 5 && player.pma <= 22 && player.titolarita >= 60) {
        if (!tags.includes('SCOMMESSA')) tags.push('SCOMMESSA');
      }
      
      if (player.titolarita >= 40 && player.titolarita <= 75) {
        if (!tags.includes('JOLLY')) tags.push('JOLLY');
      }

      return tags;
    }

    // Caricamento dati da JSON
    fetch('players.json')
      .then(res => res.json())
      .then(data => {
        allPlayers = data.map(player => ({
          ...player,
          tags: generateAutoTags(player)
        }));
        renderTable();
      })
      .catch(err => console.error("Errore caricamento players.json:", err));

    // Render della tabella
    function renderTable() {
      const tbody = document.getElementById('playerTableBody');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = allPlayers.filter(p => {
        // Controllo se già acquistato
        if (myRosa.some(r => r.id === p.id)) return false;

        // Filtro Ruolo
        if (activeRoleFilter !== 'ALL' && p.ruolo !== activeRoleFilter) return false;

        // Filtro Tag Speciali
        if (activeTagFilter && (!p.tags || !p.tags.includes(activeTagFilter))) return false;

        // Filtro Ricerca Testuale
        if (searchVal) {
          const matchName = p.nome.toLowerCase().includes(searchVal);
          const matchTeam = p.squadra.toLowerCase().includes(searchVal);
          if (!matchName && !matchTeam) return false;
        }

        return true;
      });

      document.getElementById('playerCount').textContent = `${filtered.length} GIOCATORI`;

      filtered.forEach(p => {
        const tr = document.createElement('tr');
        tr.className = 'draggable-row';
        tr.draggable = true;
        tr.ondragstart = (e) => e.dataTransfer.setData('text/plain', p.id);

        const tagsHtml = p.tags ? p.tags.map(t => `<span class="tag-badge">${t}</span>`).join('') : '';

        tr.innerHTML = `
          <td><strong>${p.nome}</strong> ${tagsHtml}</td>
          <td>${p.squadra}</td>
          <td><span class="role-badge role-${p.ruolo}">${p.ruolo}</span></td>
          <td>${p.fantamedia.toFixed(1)}</td>
          <td>${p.titolarita}%</td>
          <td class="price-tag">${p.pma} CR</td>
          <td>
            <button class="btn-action" onclick="buyPlayer(${p.id})">+ PRENDI</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Gestione Filtri Ruolo
    document.querySelectorAll('[data-role]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-role]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeRoleFilter = e.target.getAttribute('data-role');
        renderTable();
      });
    });

    // Gestione Filtri Tag Speciali
    document.querySelectorAll('[data-tag]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tag = e.target.getAttribute('data-tag');
        if (activeTagFilter === tag) {
          activeTagFilter = null;
          e.target.classList.remove('active');
        } else {
          document.querySelectorAll('[data-tag]').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          activeTagFilter = tag;
        }
        renderTable();
      });
    });

    // Listener Ricerca Testuale
    document.getElementById('searchInput').addEventListener('input', renderTable);

    // Acquista Giocatore
    function buyPlayer(id) {
      const player = allPlayers.find(p => p.id === id);
      if (player && !myRosa.some(r => r.id === id)) {
        myRosa.push(player);
        renderTable();
        renderRosa();
      }
    }

    // Rimuovi Giocatore
    function removePlayer(id) {
      myRosa = myRosa.filter(p => p.id !== id);
      renderTable();
      renderRosa();
    }

    // Render Rosa e Calcolo Budget
    function renderRosa() {
      const rosaList = document.getElementById('rosaList');
      const totalBudget = parseFloat(document.getElementById('totalBudget').value) || 1000;
      rosaList.innerHTML = '';

      let spent = 0;

      myRosa.forEach(p => {
        spent += p.pma;
        const div = document.createElement('div');
        div.className = 'rosa-item';
        div.innerHTML = `
          <div class="rosa-item-info">
            <span class="role-badge role-${p.ruolo}">${p.ruolo}</span>
            <div>
              <strong>${p.nome}</strong>
              <div style="font-size: 11px; color: #6c8cae;">${p.squadra}</div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="price-tag">${p.pma} CR</span>
            <button class="btn-remove" onclick="removePlayer(${p.id})">✕</button>
          </div>
        `;
        rosaList.appendChild(div);
      });

      document.getElementById('spentBudget').textContent = `${spent} CR`;
      document.getElementById('remainingBudget').textContent = `${totalBudget - spent} CR`;
      document.getElementById('rosaCount').textContent = `${myRosa.length}/25`;
    }

    // Toggle Sidebar Destra
    const sidebar = document.getElementById('sidebarRosa');
    const toggleBtn = document.getElementById('toggleSidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
    });

    // Drag and Drop Event Handlers
    sidebar.addEventListener('dragover', (e) => e.preventDefault());
    sidebar.addEventListener('drop', (e) => {
      e.preventDefault();
      const id = parseInt(e.dataTransfer.getData('text/plain'));
      if (id) buyPlayer(id);
    });

    // Aggiornamento dinamico budget totale al cambio input
    document.getElementById('totalBudget').addEventListener('input', renderRosa);
  </script>
</body>
</html>
