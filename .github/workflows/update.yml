name: Aggiornamento Automatico Listone Fantacalcio

on:
  schedule:
    - cron: '0 6 * * *' # Tutti i giorni alle 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Esegui scraper.py
        run: python scraper.py

      - name: Salva e fai il push del nuovo players.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add players.json
          git commit -m "Auto-update listone calciatori" || echo "Nessuna modifica da committare"
          git push origin main
