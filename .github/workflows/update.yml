name: Aggiornamento Lista Fantacalcio 2026

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Esegui aggiornamento giocatori
        run: python update_data.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add players.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update listone calciatori 2026" && git push)
