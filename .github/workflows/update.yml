name: Aggiornamento Lista Fantacalcio 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Esegui lo script Python
        run: |
          python script.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add players.json
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update listone e PMA [skip ci]"
          git push
