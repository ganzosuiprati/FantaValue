name: Aggiornamento Automatico Listone Fantacalcio

on:
  schedule:
    # 02:00 UTC corrispondono alle 04:00 italiane (CEST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install beautifulsoup4 requests

      - name: Esegui Scraper FantaPazz
        run: python scraper.py

      - name: Deploy delle modifiche
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update listone da FantaPazz"
