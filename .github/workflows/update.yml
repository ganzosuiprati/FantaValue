name: Aggiornamento Lista Fantacalcio

on:
  schedule:
    # Esegue lo script ogni giorno alle 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permette l'avvio manuale da GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Esegui Script Scraping
      run: python fetch_data.py

    - name: Commit e Push dei dati aggiornati
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add fantacola_data.json
        git commit -m "Automated data update" || exit 0
        git push
